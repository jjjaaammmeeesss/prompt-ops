# Parent-Child Communication Coach - Prompt Optimization Config
# Optimizing v1.7 修复感知版 System Prompt — R2 multi-round
# Dataset: 78 merged examples (50 old + 28 expert train, no golden answers needed)
#   - 50 original: 43 auto-generated (categories A-E) + 7 hand-labeled
#   - 28 expert: parsed from 52 expert-annotated cases (80% train split)
# Metric: LLM-as-Judge (DeepSeek-chat) — 7-dimension V4 framework
#   No golden answers required; judge scores popup quality directly from dialogue
# Calibration note: Pearson r=0.021 (judge vs expert), see results/calibration_report.json
#   Judge provides relative ranking signal for optimization; Phase E uses expert scores for validation

system_prompt:
  file: "system_prompt.txt"

# Dataset configuration — merged 78-example training set
dataset:
  path: "data/dataset_merged_train.json"
  input_field: "question"
  golden_output_field: "answer"
  adapter_class: "standard_json"
  train_size: 0.75
  validation_size: 0.15

# Model configuration - using DeepSeek
model:
  name: "deepseek/deepseek-chat"
  task_model: "deepseek/deepseek-chat"
  proposer_model: "deepseek/deepseek-chat"

# Metric: LLM-as-Judge (7-dimension V4 framework)
# Judge scores each popup directly from the dialogue — no golden answer needed
metric:
  class: "scripts/llm_judge_metric.py"

# Optimization settings
optimization:
  strategy: "basic"
