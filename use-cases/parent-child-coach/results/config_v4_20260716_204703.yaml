                    Answer: 你想保护他，所以说“大人的事跟你没关系”，这个发心是好的。但在爸爸突然不回家的空白里，孩子会自己找原因；他说“是不是我昨天不听话”，就是在把分开和自己的错连起来。这里最要紧的不是解释所有大人细节，而是反复、明确地告诉他：这不是你造成的。
