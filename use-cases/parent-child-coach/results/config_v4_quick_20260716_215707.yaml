    她从炒蛋一下跳到蛋糕、冰淇淋、当大厨，你没有泼冷水。你说“明天你做妈妈帮忙”，把她的热情变成了下一次真实行动。孩子会记住：我的兴奋有人认真接住。
    
    ### 示范 3
    
    **对话：**
    妈妈 爸爸的拖鞋怎么没有了
    爸爸拿走了 他这几天不回来住
    他去哪了
    在外面住一阵子
