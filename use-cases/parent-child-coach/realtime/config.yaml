# 周易八卦 · 亲子沟通实时弹窗系统 配置文件
# ============================================================
# v4.0.13 修正（2026-07-30）:
# - char_trigger: 120→200 + daily_conversation_skip — 日常对话误触发修复（A1）
# - cooldown: 15→30s, max_repeats: 2→1 — 重复弹出修复（A2）
# - 新增 semantic_dedup — 语义去重加强
# - system_prompt_path → v4.0.13
# v4.0.14 修正（2026-07-31，REN-42 残留问题）:
# - P0: 触发门硬拦截 risk=低 + 坤 + 容器不适用（由 daily_conversation_skip.enabled 控制）
#       — 修复 B-01/B-02/A-01 误触发（FC_UNSUPPORTED）
# - P1: DebounceGate context-drift 放行——risk_level 升高 ≥1 级或卦象转向兑/乾/巽
#       时强制放行并采用 diagnostic tone — 修复 C-03（FC_MISS_CTX + FC_TONE_OFF）
# - P2: 鼓励式弹窗强制 ≥1 句 parent-quotable repair phrase（代码级校验+重试）
# - system_prompt_path → v4.0.14
# v4.0.18 修正（2026-08-04，300字慢速通道窗口适配）:
# - 切除 prompt 中所有"窗口意识"元指令——模型只看到 300 字对话，不再被告知
#   "你只看到片段"，避免诱导它脑补缺失上下文
# - 保留：========== 分隔符（100%生效，零预分析泄漏）+ <80 字不弹窗最小片段规则
# - system_prompt_path → v4.0.18

# Stage 1: 周易三爻分析器（快速/便宜模型）
analyzer:
  model: "deepseek/deepseek-chat"
  temperature: 0.0
  max_tokens: 256
  timeout: 15.0

# Stage 2: 弹窗内容生成器（高能力模型）
generator:
  model: "deepseek/deepseek-chat"
  temperature: 0.3
  max_tokens: 640
  system_prompt_path: "../system_prompt_v4.0.18.txt"

# 触发引擎配置（统一规格 v4.0.18）
# 规格原文：慢通道凑满 300 字才分析；快通道 critical(≥4) 命中当下弹、
# 向前取最多 300 字、<80 取消；一般严重 向前取 250 字、命中后等 50 字再试图分析、<80 取消
trigger:
  char_trigger: 300           # 慢通道：凑满 300 字才分析（v4.0.18: 200→300，对齐规格）
  min_chars_for_analysis: 80  # 快通道：总字数 <80 取消
  min_interval_ms: 3000       # 两次触发最小间隔（毫秒）
  keyword_min_chars: 30       # warning/opportunity 关键词触发所需最少字数
  critical_forward: 300       # critical 命中当下弹，向前取最多 300 字
  general_forward: 250        # 一般严重向前取 250 字
  general_wait: 50            # 一般严重命中后等缓冲再进 50 字再试图分析
  keyword_file: "keyword_config.json"

# 去抖门控配置
debounce:
  cooldown_seconds: 30.0      # 相同卦象弹窗冷却秒数（v4.0.13: 15→30s）
  same_state_max_repeats: 1   # 相同卦象最多连续弹窗次数（v4.0.13: 2→1）
  absolute_min_interval: 10.0 # 任意弹窗绝对最小间隔秒数（v4.0.13: 5→10s）

# 语义去重配置（v4.0.13 新增）
dedup:
  semantic_similarity_threshold: 0.85  # 语义相似度阈值（>此值视为重复，不弹窗）
  history_window: 5                    # 保留最近 N 次弹窗内容做语义去重
  enabled: true                        # 是否启用语义去重

# 日常对话豁免配置（v4.0.13 新增）
daily_conversation_skip:
  enabled: true                        # 是否启用日常对话豁免
  max_risk_level: "低"                 # 风险≤此级别且无明显冲突信号时跳过
  skip_keywords: ["几点", "到了", "吃", "睡", "作业", "电视", "手机没电", "钥匙", "等"]  # 日常中性关键词
  force_check_required: true           # 触发前必须检查是否应豁免

# 文本缓冲配置（统一规格 v4.0.18）
buffer:
  window_size: 300            # 分析滑动窗口字符数（对齐规格：critical 向前最多 300）
  lookback: 50                # 窗口间回看重叠字符数（对齐规格：一般严重向后等 50）
  chunk_size: 60              # 模拟流式输入时每块字符数

# 弹窗字数限制
popup_limits:
  diagnostic_min: 80
  diagnostic_max: 200
  encouraging_min: 20
  encouraging_max: 80

# 演示/测试配置
demo:
  chunk_delay_ms: 50          # 模拟流式输入的块间延迟（毫秒）
  show_analysis_log: true     # 是否打印分析日志
  show_suppressed: true       # 是否打印被抑制的触发
