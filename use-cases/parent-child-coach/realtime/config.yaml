# 周易八卦 · 亲子沟通实时弹窗系统 配置文件
# ============================================================
# v4.0.13 修正（2026-07-30）:
# - char_trigger: 120→200 + daily_conversation_skip — 日常对话误触发修复（A1）
# - cooldown: 15→30s, max_repeats: 2→1 — 重复弹出修复（A2）
# - 新增 semantic_dedup — 语义去重加强
# - system_prompt_path → v4.0.13
# v4.0.14 修正（2026-07-31，REN-42 残留问题）:
# - P0: 触发门硬拦截 risk=低 + 坤 + 容器不适用（由 daily_conversation_skip.enabled 控制）
#       — 修复 B-01/B-02/A-01 误触发（FC_UNSUPPORTED）
# - P1: DebounceGate context-drift 放行——risk_level 升高 ≥1 级或卦象转向兑/乾/巽
#       时强制放行并采用 diagnostic tone — 修复 C-03（FC_MISS_CTX + FC_TONE_OFF）
# - P2: 鼓励式弹窗强制 ≥1 句 parent-quotable repair phrase（代码级校验+重试）
# - system_prompt_path → v4.0.14
# v4.0.15 修正（2026-08-01，REN-50 三项 dominant FC 闭环）:
# - FC_MISS_CTX: daily_conversation_skip 增加 child_distress_exemption — 孩子困扰信号命中时不豁免
#   （Stage 1 同步修正：风险提至中、不输出"不弹窗"）
# - FC_TONE_OFF: 提示词层新增「家长行为 tone override」（催促/打断/贴标签/命令/轻度贬低→强制诊断式，
#   冻结 tone 灵活覆盖），优先级低于安全路由、高于卦象 tone
# - FC_STALE: dedup.semantic_similarity_threshold 0.85→0.70 — 原 0.85 漏过 0.79–0.84 的语义雷同弹窗
# - system_prompt_path → v4.0.15
# v4.0.16 修正（2026-08-01，REN-50 两项接线失效修复）:
# - FC_TONE_OFF 代码层闭环: popup_generator.generate() 调 LLM 前扫描 dialogue_window，
#   命中家长行为 override 关键词时强制 tone=DIAGNOSTIC（v4.0.15 仅 prompt 层规则，
#   但 tone 在 _build_messages 中已固化，LLM 无权改 tone → 规则从未执行）
# - FC_STALE 代码层闭环: popup_generator.generate() 返回前与 previous_popups 做语义相似度
#   比对（difflib SequenceMatcher），超过阈值则拒绝弹窗（v4.0.15 config 有 dedup 段但
#   无代码读取，previous_popups 参数收了但没用）
# - dedup 配置通过 cli_demo.py 传入 PopupGenerator（dedup_config 参数）
# - system_prompt_path → v4.0.16

# Stage 1: 周易三爻分析器（快速/便宜模型）
analyzer:
  model: "deepseek/deepseek-chat"
  temperature: 0.0
  max_tokens: 256
  timeout: 15.0

# Stage 2: 弹窗内容生成器（高能力模型）
generator:
  model: "deepseek/deepseek-chat"
  temperature: 0.3
  max_tokens: 640
  system_prompt_path: "../system_prompt_v4.0.16.txt"

# 触发引擎配置
trigger:
  char_trigger: 200           # 每 N 字触发一次分析（v4.0.13: 120→200，降低日常对话误触发）
  min_chars_for_analysis: 80  # 最少累积字数才触发（v4.0.13: 60→80）
  min_interval_ms: 3000       # 两次触发最小间隔（毫秒）
  keyword_min_chars: 30       # warning/opportunity 关键词触发所需最少字数
  keyword_file: "keyword_config.json"

# 去抖门控配置
debounce:
  cooldown_seconds: 30.0      # 相同卦象弹窗冷却秒数（v4.0.13: 15→30s）
  same_state_max_repeats: 1   # 相同卦象最多连续弹窗次数（v4.0.13: 2→1）
  absolute_min_interval: 10.0 # 任意弹窗绝对最小间隔秒数（v4.0.13: 5→10s）

# 语义去重配置（v4.0.13 新增，v4.0.15 调阈值 FC_STALE 闭环）
dedup:
  semantic_similarity_threshold: 0.70  # v4.0.15: 0.85→0.70（原值漏过 0.79–0.84 的语义雷同弹窗，FC_STALE）
  history_window: 5                    # 保留最近 N 次弹窗内容做语义去重
  enabled: true                        # 是否启用语义去重

# 日常对话豁免配置（v4.0.13 新增，v4.0.15 增加 child_distress_exemption FC_MISS_CTX 闭环）
daily_conversation_skip:
  enabled: true                        # 是否启用日常对话豁免
  max_risk_level: "低"                 # 风险≤此级别且无明显冲突信号时跳过
  skip_keywords: ["几点", "到了", "吃", "睡", "作业", "电视", "手机没电", "钥匙", "等"]  # 日常中性关键词
  force_check_required: true           # 触发前必须检查是否应豁免
  # v4.0.15 新增：孩子困扰信号豁免例外（命中则不豁免，风险提至中）
  child_distress_exemption:
    enabled: true
    distress_signals: ["他们笑我", "没人跟我玩", "我不敢去", "疼", "肚子不舒服", "我睡不着",
                        "我笨", "学不会", "做不好", "说我傻",
                        "没什么", "算了不说了", "我不敢告诉你",
                        "怎么办", "会不会不要我", "还会爱我吗"]
    on_match: "skip_exemption"         # 命中时取消豁免，强制进入弹窗流程

# 文本缓冲配置
buffer:
  window_size: 3000           # 分析滑动窗口字符数
  lookback: 500               # 窗口间回看重叠字符数
  chunk_size: 60              # 模拟流式输入时每块字符数

# 弹窗字数限制
popup_limits:
  diagnostic_min: 80
  diagnostic_max: 200
  encouraging_min: 20
  encouraging_max: 80

# 演示/测试配置
demo:
  chunk_delay_ms: 50          # 模拟流式输入的块间延迟（毫秒）
  show_analysis_log: true     # 是否打印分析日志
  show_suppressed: true       # 是否打印被抑制的触发
